name: Code checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: code-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff from the project lockfile
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tomllib

          lock = tomllib.loads(pathlib.Path('uv.lock').read_text())
          ruff = next(package for package in lock['package'] if package['name'] == 'ruff')
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', f"ruff=={ruff['version']}"])
          PY
      - name: Lint
        run: ruff check .
      - name: Check Python syntax
        run: python -m compileall -q src tests scripts examples benchmarks simulation tools/molmo_motion_cache/src tools/molmo_motion_cache/tests

  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked runtime dependencies with CPU PyTorch
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tomllib

          packages = tomllib.loads(pathlib.Path('uv.lock').read_text())['package']
          versions = {p['name']: p['version'] for p in packages}
          cpu = [f"{name}=={versions[name].split('+')[0]}" for name in ('torch', 'torchvision')]
          subprocess.check_call([
              sys.executable, '-m', 'pip', 'install', *cpu,
              '--index-url', 'https://download.pytorch.org/whl/cpu',
          ])
          constraints = pathlib.Path('/tmp/lbm-ci-constraints.txt')
          constraints.write_text('\n'.join(
              f"{name}=={version}" for name, version in versions.items()
              if name not in {'lbm', 'torch', 'torchvision'}
          ) + '\n')
          subprocess.check_call([
              sys.executable, '-m', 'pip', 'install', '-c', str(constraints), '-e', '.[dev,data]',
          ])
          PY
      - name: Run CPU regression tests
        run: pytest -q -ra -m 'not integration and not gpu'
