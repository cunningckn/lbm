[project]
name = "lbm-lerobot"
version = "0.1.0"
description = "LeRobot dataset conversion environment for LBM simulation data."
requires-python = ">=3.11,<3.12"
dependencies = [
    "lerobot",
    "dlimp",
    "tensorflow-cpu==2.15.0",
    "tensorflow-datasets==4.9.9",
    "tensorflow-metadata==1.17.1",
    "protobuf==4.25.8",
    "numpy>=1.22.4,<2.0.0",
    "opencv-python>=4.10.0.84",
    "h5py>=3.10.0",
    "tqdm",
    "tyro>=0.9.5",
    "pillow>=11.0.0",
    "huggingface-hub>=0.27.1,<1",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

[tool.uv]
package = false
# Cache and project live on different filesystems here; hardlinks are not available.
link-mode = "copy"
# tensorflow-cpu 2.15.0 only ships cp311 wheels; pin matching transitive TF deps.
# Drop the GPU `tensorflow` wheel that dlimp pulls in (tensorflow-cpu provides the same import).
override-dependencies = [
    "ml-dtypes==0.4.1",
    "tensorstore==0.1.74",
    "protobuf==4.25.8",
    "tensorflow-metadata==1.17.1",
    "tensorflow; python_version < '0.0'",
]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Pinned LeRobot / dlimp git revs (Python 3.11 conversion env).
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
dlimp = { git = "https://github.com/kvablack/dlimp", rev = "ad72ce3a9b414db2185bc0b38461d4101a65477a" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
