[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molmo-motion-cache"
version = "0.2.0"
description = "Portable mmap cache builder and reader for MolmoMotion-1M"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyarrow>=15",
]

[project.scripts]
molmo-motion-cache = "molmo_motion_cache.cli:main"

[project.optional-dependencies]
rgb = ["av>=17", "pillow>=12"]

[tool.setuptools.packages.find]
where = ["src"]
